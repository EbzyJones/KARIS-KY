[package]
name = "karis_ky_escrow"
version = "0.1.0"
edition = "2021"
description = "karis-ky invoice escrow contract - holds funds until settlement"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "25.0"

[dev-dependencies]
soroban-sdk = { version = "25.0", features = ["testutils"] }
proptest = "1.6.0"
insta = { version = "1.45", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.0"

