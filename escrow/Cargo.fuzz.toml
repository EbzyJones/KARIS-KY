[package]
name = "escrow-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[[bin]]
name = "escrow_funding_operations"
path = "fuzz/fuzz_targets/escrow_funding_operations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "escrow_settlement_flow"
path = "fuzz/fuzz_targets/escrow_settlement_flow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "escrow_yield_calculations"
path = "fuzz/fuzz_targets/escrow_yield_calculations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "escrow_init_validation"
path = "fuzz/fuzz_targets/escrow_init_validation.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
