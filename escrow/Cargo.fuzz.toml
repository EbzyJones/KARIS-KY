[package]
name = "karis_ky_escrow_fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "escrow_funding_operations"
path = "fuzz/fuzz_targets/escrow_funding_operations.rs"
test = false
doc = false

[[bin]]
name = "escrow_settlement_flow"
path = "fuzz/fuzz_targets/escrow_settlement_flow.rs"
test = false
doc = false

[[bin]]
name = "escrow_yield_calculations"
path = "fuzz/fuzz_targets/escrow_yield_calculations.rs"
test = false
doc = false

[dependencies]
karis_ky_escrow = { path = ".." }
soroban-sdk = { version = "25.0", features = ["testutils"] }
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
