name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check repository-relative Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --verbose --exclude-path '(^|/)node_modules(/|$)' '**/*.md'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck and lint deployment scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck \
            scripts/deploy.sh \
            scripts/local-env.sh \
            scripts/pre-flight-checklist.sh \
            scripts/canary-smoke-test.sh \
            scripts/verify_deployment.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint OpenAPI spec
        # Validates docs/openapi.yaml against the OpenAPI specification so the
        # spec stays in sync with the actual backend endpoints.
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  fmt-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backup test dependencies
        run: python -m pip install pytest "stellar-sdk>=11.0.0"

      - name: Test escrow backup tooling
        run: python -m pytest backend/tests

  fmt-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt -p karis_ky_escrow -- --check

      - name: Clippy
        run: cargo clippy -p karis_ky_escrow -- -D warnings

      - name: Build
        run: cargo build

      - name: Build docs (deny broken intra-doc links)
        # Fails CI on any broken rustdoc intra-doc link so documentation
        # references to non-existent items cannot regress unnoticed.
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (dependency vulnerability scan)
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@c95a8e71b2aa92ca779c9c822b9d41038c0fc503 # cargo-deny

      - name: Run cargo-deny (licenses, bans, advisories)
        run: cargo deny check

      - name: Run tests
        run: cargo test

      - name: Run snapshot tests
        run: cargo test --test snapshots
        env:
          INSTA_FORCE_ACCEPT: "false"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release -p karis_ky_escrow
        env:
          # Make missing git metadata a hard build error in CI/release builds
          # so the WASM artifact always carries a real commit hash. Local dev
          # builds can unset this to allow tarball/shallow-checkout workflows.
          REQUIRE_GIT_METADATA: "1"

      # -----------------------------------------------------------------------
      # Build metadata validation
      # -----------------------------------------------------------------------
      #
      # Verifies that the metadata embedded into the WASM artifact by
      # `escrow/build.rs` (git commit, build timestamp, package version,
      # and the source-of-truth schema/interface versions) matches the
      # values declared in `escrow/src/lib.rs`. Fails the build on drift.

      - name: Validate embedded build metadata
        run: |
          python3 scripts/validate_build_metadata.py \
            --json target/build_metadata.json \
            --lib escrow/src/lib.rs

      - name: Validate WASM build metadata matches current commit
        # Asserts the metadata embedded in the freshly built WASM artifact
        # matches the current commit SHA and the expected schema version.
        # Fails CI if build.rs did not regenerate constants (e.g. stale
        # incremental builds) or if the schema version drifted.
        run: |
          python3 scripts/validate_build_metadata.py \
            --wasm target/wasm32-unknown-unknown/release/karis_ky_escrow.wasm \
            --commit "$GITHUB_SHA" \
            --schema-version "${SCHEMA_VERSION:-6}"
        env:
          SCHEMA_VERSION: "6"

      # -----------------------------------------------------------------------
      # Schema version compatibility matrix validation
      # -----------------------------------------------------------------------
      #
      # Validates that SCHEMA_VERSION in escrow/src/lib.rs matches the latest
      # entry in docs/VERSION_INTEROPERABILITY_MATRIX.md. Catches drift that
      # could lead operators to attempt unsupported upgrade paths.

      - name: Validate schema version matrix
        run: |
          python3 scripts/validate_schema_version_matrix.py

      - name: Test schema version matrix validation
        run: |
          python3 scripts/test_validate_schema_version_matrix.py

      # -----------------------------------------------------------------------
      # WASM size tracking
      # -----------------------------------------------------------------------

      - name: Check WASM size
        # Fails the build if the artifact exceeds 1 MB or grew >10% vs baseline.
        # On pushes to main, --record updates the baseline JSON and it is
        # committed back via the "Update WASM size baseline" step below.
        run: |
          python3 scripts/check_wasm_size.py \
            --wasm target/wasm32-unknown-unknown/release/karis_ky_escrow.wasm \
            --baseline scripts/wasm_size_baseline.json \
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--record' || '' }}

      - name: Generate WASM size trend report
        # Always runs (even on failure) so we get a report in the job summary.
        if: always()
        run: |
          python3 scripts/wasm_size_report.py \
            --baseline scripts/wasm_size_baseline.json \
            --format markdown \
            --out /tmp/wasm_size_report.md
          # Append to the GitHub Actions job summary
          cat /tmp/wasm_size_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM size report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-size-report
          path: /tmp/wasm_size_report.md
          retention-days: 90

      - name: Upload WASM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: karis-ky-escrow-wasm
          path: target/wasm32-unknown-unknown/release/karis_ky_escrow.wasm
          retention-days: 90

      - name: Commit updated WASM size baseline
        # Only runs on main push after a clean size check, so baseline stays
        # in sync with production builds.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet scripts/wasm_size_baseline.json || (
            git add scripts/wasm_size_baseline.json &&
            git commit -m "chore: update WASM size baseline [skip ci]" &&
            git push
          )

      # -----------------------------------------------------------------------
      # Contract spec (ABI) extraction and publishing
      # -----------------------------------------------------------------------

      - name: Validate contract spec
        # Ensures spec.json is valid JSON and matches the deployed contract version.
        run: |
          python3 -c "
          import json
          with open('sdk-ts/spec.json') as f:
              spec = json.load(f)
          sv = spec['contract']['schema_version']
          iv = spec['contract']['interface_version']
          print(f'Spec schema_version={sv}, interface_version={iv}')
          assert sv == ${SCHEMA_VERSION:-6}, f'spec schema_version {sv} != expected ${SCHEMA_VERSION:-6}'
          assert iv == ${INTERFACE_VERSION:-1}, f'spec interface_version {iv} != expected ${INTERFACE_VERSION:-1}'
          print('Spec validation OK')
          "
        env:
          SCHEMA_VERSION: "6"
          INTERFACE_VERSION: "1"

      - name: Upload contract spec artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: karis-ky-escrow-spec
          path: sdk-ts/spec.json
          retention-days: 90

      - name: Publish spec to GitHub Release
        # On main pushes, attach the spec to a versioned GitHub release.
        # Creates or updates a 'spec' tag release with the latest spec.json.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SPEC_VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "SPEC_VERSION=${SPEC_VERSION}" >> $GITHUB_ENV
