<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karis-ky Split View</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, #07111f, #11263a);
        color: #f5f7fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(720px, 90vw);
        background: rgba(8, 15, 28, 0.84);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 20px 45px rgba(0,0,0,0.3);
      }
      h1 { margin-top: 0; }
      .pill { display: inline-block; padding: 0.35rem 0.75rem; border-radius: 999px; background: #1aa981; color: white; font-size: 0.9rem; }
      #status { margin-top: 1rem; padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.06); }
      code { background: rgba(255,255,255,0.08); padding: 0.2rem 0.4rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="pill">karis-ky frontend</span>
      <h1>karis-ky frontend connected to backend</h1>
      <p>This page is served from the frontend layer while the contract intelligence lives in a separate backend API.</p>
      <div id="status">Loading backend status…</div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
