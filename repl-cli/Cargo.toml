[package]
name = "repl-cli"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rustyline = "14.0"
colored = "2.1"
serde_json = "1.0"
soroban-cli = "21.7"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "repl-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
