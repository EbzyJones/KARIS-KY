openapi: "3.1.0"

info:
  title: karis-ky API
  version: "1.0.0"
  description: |
    REST API for the karis-ky global invoice liquidity network on Stellar.
    Exposes the health check and contract summary endpoints served by the backend.
    All monetary amounts are in the smallest unit (stroops: 1 XLM = 10,000,000 stroops).
  contact:
    name: karis-ky
  license:
    name: MIT

servers:
  - url: https://api.karis-ky.io
    description: Production
  - url: http://localhost:4000
    description: Local development

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued after wallet-based authentication.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- Shared primitives ---------------------------------------------------

    StellarAddress:
      type: string
      pattern: "^[A-Z2-7]{56}$"
      description: Stellar public key (G… or C… address, 56 chars, base32).
      example: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"

    InvoiceId:
      type: string
      minLength: 1
      maxLength: 12
      pattern: "^[A-Za-z0-9_-]+$"
      description: Short alphanumeric invoice identifier (Soroban Symbol, max 12 chars).
      example: "INV-1023"

    EscrowStatus:
      type: integer
      enum: [0, 1, 2]
      description: |
        Escrow lifecycle state:
        - `0` — open (accepting funding)
        - `1` — funded (target met; SME can receive liquidity)
        - `2` — settled (buyer paid; investors receive principal + yield)

    # -- Domain objects ------------------------------------------------------

    InvoiceEscrow:
      type: object
      required:
        - invoice_id
        - sme_address
        - buyer_address
        - amount
        - funding_target
        - funded_amount
        - yield_bps
        - maturity
        - status
        - is_paid
      properties:
        invoice_id:
          $ref: "#/components/schemas/InvoiceId"
        sme_address:
          $ref: "#/components/schemas/StellarAddress"
        buyer_address:
          $ref: "#/components/schemas/StellarAddress"
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Total invoice amount in stroops.
          example: 100000000000
        funding_target:
          type: integer
          format: int64
          minimum: 1
          description: Funding target in stroops (equals `amount` at init).
          example: 100000000000
        funded_amount:
          type: integer
          format: int64
          minimum: 0
          description: Total investor contributions received so far, in stroops.
          example: 50000000000
        yield_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Investor yield in basis points (e.g. 800 = 8 %).
          example: 800
        maturity:
          type: integer
          format: int64
          minimum: 0
          description: Maturity ledger timestamp (Unix seconds).
          example: 1000
        status:
          $ref: "#/components/schemas/EscrowStatus"
        is_paid:
          type: boolean
          description: Whether the buyer has confirmed payment (repayment of invoice).
          example: false

    InvoiceSummary:
      type: object
      required: [invoice_id, amount, status]
      properties:
        invoice_id:
          $ref: "#/components/schemas/InvoiceId"
        amount:
          type: integer
          format: int64
          minimum: 1
          example: 100000000000
        status:
          $ref: "#/components/schemas/EscrowStatus"

    # -- Request bodies ------------------------------------------------------

    InitEscrowRequest:
      type: object
      required:
        - invoice_id
        - sme_address
        - buyer_address
        - amount
        - yield_bps
        - maturity
      properties:
        invoice_id:
          $ref: "#/components/schemas/InvoiceId"
        sme_address:
          $ref: "#/components/schemas/StellarAddress"
        buyer_address:
          $ref: "#/components/schemas/StellarAddress"
        amount:
          type: integer
          format: int64
          minimum: 1
          example: 100000000000
        yield_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          example: 800
        maturity:
          type: integer
          format: int64
          minimum: 1
          example: 1000

    FundEscrowRequest:
      type: object
      required:
        - investor_address
        - amount
      properties:
        investor_address:
          $ref: "#/components/schemas/StellarAddress"
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount to contribute in stroops.
          example: 50000000000

    # -- Responses -----------------------------------------------------------

    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: "2026-03-23T21:46:03Z"

    ContractSummaryResponse:
      type: object
      required: [contract_id, network, invoice_count]
      properties:
        contract_id:
          type: string
          description: Deployed Soroban contract identifier.
          example: "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM"
        network:
          type: string
          enum: [mainnet, testnet, futurenet]
          example: testnet
        invoice_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of invoices tracked by the contract.
          example: 42

    ApiInfoResponse:
      type: object
      required: [name, version, network]
      properties:
        name:
          type: string
          example: karis-ky API
        version:
          type: string
          example: "1.0.0"
        network:
          type: string
          enum: [mainnet, testnet, futurenet]
          example: mainnet
        docs_url:
          type: string
          format: uri
          example: "https://docs.karis-ky.io"

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: "Invoice INV-1023 not found."

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: UNAUTHORIZED
            message: "Bearer token is missing or expired."

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: NOT_FOUND
            message: "Invoice not found."

    UnprocessableEntity:
      description: Validation error or invalid state transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: INVALID_STATE
            message: "Escrow is not open for funding."

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: INTERNAL_ERROR
            message: "An unexpected error occurred."

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # -- Health ----------------------------------------------------------------

  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the current service health status and server timestamp.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # -- Contract summary ------------------------------------------------------

  /api/contract-summary:
    get:
      operationId: getContractSummary
      summary: Contract summary
      description: Returns a summary of the deployed Soroban contract and its tracked invoices.
      tags: [Contract]
      security: []
      responses:
        "200":
          description: Contract summary retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSummaryResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

tags:
  - name: Health
    description: Service health and readiness.
  - name: Contract
    description: Soroban contract metadata and summaries.
